; Cache de operaciones de PHP.
; Es una API de lectura con SSR en el frontend: compilar y cachear mas evita
; trabajo repetido sin volver la aplicacion mas comoda de operar.

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0