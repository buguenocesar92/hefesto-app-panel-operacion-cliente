; Ajustes de PHP para el panel.
; Valores razonados para una API de solo lectura con pocas consultas.

memory_limit = 256M
max_execution_time = 30

; Nunca mostrar errores en la respuesta al cliente: la API ya tiene su propio
; manejador de errores que devuelve mensajes genericos.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off